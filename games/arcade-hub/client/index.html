<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08091a" />
    <title>Crono Arcade</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="arcade-shell" id="arcade-shell">
      <canvas id="game" aria-label="Campo di gioco"></canvas>

      <header class="hud hud-top">
        <div><b id="game-title">Crono Arcade</b><span id="game-subtitle">Sfida rapida</span></div>
        <div class="connection" id="connection">SOLO</div>
      </header>

      <aside class="hud score-panel">
        <span>PUNTI</span><strong id="score">0000</strong>
        <span class="mini-label" id="mission">Sopravvivi</span>
      </aside>

      <aside class="hud players-panel" id="players-panel" hidden>
        <span id="room-label">STANZA</span>
        <strong id="population">1 giocatore</strong>
      </aside>

      <section class="leaderboard" id="leaderboard" hidden>
        <span>TOP 5</span>
        <ol id="leaderboard-list"></ol>
      </section>

      <section class="welcome" id="welcome">
        <p class="eyebrow">CRONOGAMES ARCADE</p>
        <h1 id="welcome-title">Crono Arcade</h1>
        <p id="welcome-description">Una sfida immediata da giocare nel browser.</p>
        <label for="nickname">NICKNAME
          <input id="nickname" maxlength="16" autocomplete="nickname" />
        </label>
        <button id="play" type="button">GIOCA <span>→</span></button>
        <p class="help" id="help">WASD / frecce per muoverti · Spazio per l’azione</p>
      </section>

      <div class="notice" id="notice" aria-live="polite"></div>

      <div class="touch-controls" aria-label="Comandi touch">
        <div class="touch-stick" id="touch-stick"><i id="touch-knob"></i></div>
        <button class="touch-action" id="touch-action" type="button">AZIONE</button>
      </div>
    </main>
    <script src="game.js"></script>
  </body>
</html>
