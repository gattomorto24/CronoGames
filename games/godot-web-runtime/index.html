<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CronoGames</title><style>html,body,canvas{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;touch-action:none}#status{position:fixed;inset:0;display:grid;place-items:center;color:#dff;font:600 16px system-ui;background:#07101d;letter-spacing:.08em}</style></head>
<body><canvas id="canvas"></canvas><div id="status">CARICAMENTO GODOT…</div><script src="index.js"></script><script>
const game = new URLSearchParams(location.search).get('game') || '';
const titles = {"neon-dodge":"Neon Dodge","meteor-dash":"Meteor Dash","orbital-hoops":"Orbital Hoops","pixel-raiders":"Pixel Raiders","maze-rush":"Maze Rush","drift-nova":"Drift Nova","turbo-towers":"Turbo Towers","echo-jump":"Echo Jump","bubble-blitz":"Bubble Blitz","circuit-sprint":"Circuit Sprint","crystal-catch":"Crystal Catch","lava-hop":"Lava Hop","star-slinger":"Star Slinger","shadow-chase":"Shadow Chase","skyline-run":"Skyline Run","void-survivor":"Void Survivor","rocket-rally":"Rocket Rally","prism-puzzle":"Prism Puzzle","cosmo-pong":"Cosmo Pong","drone-arena":"Drone Arena"};
if (!titles[game]) document.querySelector('#status').textContent = 'Gioco Godot non valido.';
else { document.title = titles[game]; const engine = new Engine({executable:'index',mainPack:`../${game}/client/index.pck`,canvasResizePolicy:2,focusCanvas:true}); engine.startGame({onProgress:(loaded,total)=>{document.querySelector('#status').textContent=total?`CARICAMENTO ${Math.round(loaded/total*100)}%`:'CARICAMENTO GODOT…'}}).then(()=>document.querySelector('#status').remove(),err=>{document.querySelector('#status').textContent=`Errore di avvio: ${err.message||err}`;console.error(err)}); }
</script></body></html>
